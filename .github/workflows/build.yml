name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Hämta koden
      uses: actions/checkout@v4

    - name: Sätt upp Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installera beroenden
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Skapa EXE-filen
      run: >
        pyinstaller --noconfirm --onefile --windowed
        --icon "src/assets/logo.ico"
        --name "PyMacroRecord"
        --add-data "src/assets;assets/"
        --add-data "src/langs;langs/"
        --add-data "src/hotkeys;hotkeys/"
        --add-data "src/macro;macro/"
        --add-data "src/utils;utils/"
        --add-data "src/windows;windows/"
        "src/main.py"

    - name: Ladda upp den färdiga EXE-filen
      uses: actions/upload-artifact@v4
      with:
        name: PyMacroRecord-EXE
        path: dist/PyMacroRecord.exe
